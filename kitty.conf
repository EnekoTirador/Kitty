# ~/.config/kitty/kitty.conf

# Fuente
font_family      JetBrainsMono Nerd Font
font_size        12.0

# Ventana
window_padding_width 10
background_opacity   0.92
confirm_os_window_close 0

# Tema de colores (Catppuccin Mocha)
foreground              #CDD6F4
background              #000000
selection_foreground    #1E1E2E
selection_background    #F5E0DC
cursor                  #F5E0DC
color0                  #45475A
color1                  #F38BA8
color2                  #A6E3A1
color3                  #F9E2AF
color4                  #89B4FA
color5                  #F5C2E7
color6                  #94E2D5
color7                  #BAC2DE
color8                  #585B70
color9                  #F38BA8
color10                 #A6E3A1
color11                 #F9E2AF
color12                 #89B4FA
color13                 #F5C2E7
color14                 #94E2D5
color15                 #A6ADC8

# Barra de pestañas
tab_bar_edge     bottom
tab_bar_style    powerline

# Quitar barra top
hide_window_decorations yes
